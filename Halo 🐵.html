<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halo 🐵</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFD21F;--ink:#16301f;--pink:#FF4F8B;--leaf:#0F3D2E;--card:#fffbe8;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#e9b900;--card:#fff4c2}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overflow-x:hidden;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 18px 40px;text-align:center;position:relative}
.stage{display:none}.stage.on{display:block}
/* bait */
.bait h1{font-family:'Bagel Fat One',Impact,sans-serif;font-size:2.4rem;line-height:1.05;margin:56px 0 10px;color:var(--leaf)}
.bait p{font-weight:800;margin:0 0 26px}
.gift{font-size:5rem;display:inline-block;animation:wob 1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.bar{height:22px;border-radius:99px;background:#fff8;border:3px solid var(--leaf);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .25s}
.status{margin-top:12px;font-weight:800;min-height:1.4em}
/* reveal */
.reveal h2{font-family:'Bagel Fat One',Impact,sans-serif;font-size:clamp(4.5rem,24vw,7.5rem);line-height:.9;margin:6px 0 10px;color:var(--pink);-webkit-text-stroke:3px var(--leaf);paint-order:stroke fill;text-shadow:5px 6px 0 var(--leaf)}
.frame{position:relative;display:inline-block;border:6px solid var(--leaf);border-radius:28px;background:var(--leaf);box-shadow:8px 10px 0 var(--pink);transform:rotate(-2deg);cursor:pointer;-webkit-tap-highlight-color:transparent}
.frame img{display:block;width:min(78vw,330px);height:auto;border-radius:20px}
.frame:active{transform:rotate(1deg) scale(.97)}
.bubble{position:absolute;top:-18px;right:-14px;max-width:190px;background:#fff;border:4px solid var(--leaf);border-radius:20px;padding:8px 14px;font-weight:800;transform:rotate(4deg);opacity:0;transition:opacity .2s}
.bubble.show{opacity:1}
.hint{margin:22px 0 10px;font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:56px;align-items:center}
button{font:inherit;font-weight:800;border:3px solid var(--leaf);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 16px;cursor:pointer;box-shadow:3px 4px 0 var(--leaf)}
button:focus-visible{outline:4px solid var(--pink);outline-offset:2px}
button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--leaf)}
#claim{background:var(--pink);color:#fff;position:relative}
.count{margin-top:18px;font-size:.9rem;font-weight:800;opacity:.8}
.fall{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-2px)}80%{transform:translate(6px,2px)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.gift,.fall,.pop,.shake{animation:none}}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<main id="app">
  <section class="stage bait" id="bait">
    <div class="gift">🎁</div>
    <h1>Selamat! Kamu terpilih 🎉</h1>
    <p>Hadiah undian Rp10.000.000 sedang disiapkan khusus untukmu…</p>
    <div class="bar" role="progressbar" aria-label="Memuat hadiah"><i id="fill"></i></div>
    <div class="status" id="status">Memverifikasi data…</div>
  </section>

  <section class="stage reveal on" id="reveal">
    <h2 class="pop">HALO.</h2>

      <div class="bubble" id="bubble">Halo.</div>
    </div>
    <p class="hint">Hadiahnya? Ya dia. Ketuk monyetnya.</p>
    <div class="row">
      <button id="claim">Klaim hadiah</button>
      <button id="say">🔊 Bilang halo</button>
      <button id="share">🔗 Prank temanmu</button>
    </div>
    <div class="count" id="count">Monyet sudah disapa 0 kali</div>
  </section>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var steps=[[12,'Memverifikasi data…'],[37,'Mencocokkan nomor undian…'],[64,'Mengirim hadiah ke rekening…'],[88,'Menghitung pajak pisang…'],[99,'Hampir selesai…']];
  var i=0;
  function tick(){
    if(i<steps.length){$('fill').style.width=steps[i][0]+'%';$('status').textContent=steps[i][1];i++;setTimeout(tick,i===steps.length?1900:850)}
    else boom();
  }
  function speak(t){
    try{var u=new SpeechSynthesisUtterance(t||'halo');u.lang='id-ID';u.pitch=1.6;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
  }
  function rain(){
    var e=['🍌','🐵','🍌','🙈','🍌','🙉'];
    for(var k=0;k<26;k++){var s=document.createElement('span');s.className='fall';s.textContent=e[k%e.length];
      s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2.5)+'s';s.style.animationDelay=(Math.random()*.9)+'s';
      document.body.appendChild(s);setTimeout(function(n){n.remove()},5500,s)}
  }
  function boom(){
    $('flash').classList.add('go');
    document.title='HALO. 🐵';
    $('bait').classList.remove('on');$('reveal').classList.add('on');
    $('app').classList.add('shake');
    speak('halo');rain();
  }
  function greet(){var b=$('bubble');b.textContent='Halo.';b.classList.add('show');setTimeout(function(){b.classList.remove('show')},2200);speak('halo');rain();}
  setTimeout(greet,500);
  var first=function(){document.removeEventListener('pointerdown',first);document.removeEventListener('keydown',first);speak('halo')};
  document.addEventListener('pointerdown',first);document.addEventListener('keydown',first);

  var lines=['Halo.','Halo juga.','Kok ketuk-ketuk?','Hadiahnya mana? Aku juga nanya.','Kamu kena prank 🍌','Aku bukan hadiah, aku pemenangnya.','Halo?? Masih di situ?','Ssst… jangan bilang siapa-siapa.'];
  var n=0,bt;
  function hi(){
    n++;$('count').textContent='Monyet sudah disapa '+n+' kali';
    var b=$('bubble');b.textContent=lines[n%lines.length];b.classList.add('show');
    clearTimeout(bt);bt=setTimeout(function(){b.classList.remove('show')},1800);
    speak(n%3===0?'halo juga':'halo');
    if(n%5===0)rain();
  }
  $('frame').addEventListener('click',hi);
  $('frame').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hi()}});
  $('say').addEventListener('click',hi);

  var dodges=0,claim=$('claim');
  var msgs=['Eh, ketangkap! Hadiahmu: foto monyet ini.','Sudah dibilang, ini hadiahnya.'];
  function dodge(){
    if(dodges>=4){return}
    dodges++;
    var r=document.querySelector('.row').getBoundingClientRect();
    claim.style.position='relative';
    claim.style.left=(Math.random()*120-60)+'px';
    claim.style.top=(Math.random()*80-40)+'px';
    if(dodges===4)claim.textContent='Oke, kamu menang 🍌';
  }
  claim.addEventListener('mouseenter',dodge);
  claim.addEventListener('touchstart',function(e){if(dodges<4){e.preventDefault();dodge()}},{passive:false});
  claim.addEventListener('click',function(){
    var b=$('bubble');b.textContent=dodges>=4?'Selamat! Hadiahmu: aku. Halo.':'Hadiahnya foto monyet ini. Halo.';
    b.classList.add('show');setTimeout(function(){b.classList.remove('show')},2200);speak('halo');rain();
  });

  $('share').addEventListener('click',function(){
    var b=this,u=location.href;
    function ok(){b.textContent='✅ Link disalin!';setTimeout(function(){b.textContent='🔗 Prank temanmu'},1800)}
    try{navigator.clipboard.writeText(u).then(ok,function(){b.textContent='Salin link dari address bar ya'})}
    catch(e){b.textContent='Salin link dari address bar ya'}
  });
})();
</script>
